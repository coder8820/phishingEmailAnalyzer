name: PhishGuard AI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---- Backend Tests ----
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: phishguard_test
          POSTGRES_USER: phishguard
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check app/ tests/

      - name: Run Bandit SAST
        run: bandit -r app/ -ll -f json -o bandit-report.json || true

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://phishguard:test_password@localhost:5432/phishguard_test
          APP_SECRET_KEY: test-secret-key-not-for-production-only-testing
          APP_ENV: test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          POSTGRES_PASSWORD: test_password
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItdGVzdA==
        run: alembic upgrade head

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://phishguard:test_password@localhost:5432/phishguard_test
          APP_SECRET_KEY: test-secret-key-not-for-production-only-testing
          APP_ENV: test
          AI_PROVIDER: mock
          TI_DEMO_MODE: "true"
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          POSTGRES_PASSWORD: test_password
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItdGVzdA==
        run: |
          pytest tests/backend/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml

  # ---- Frontend Tests ----
  frontend-test:
    name: Frontend Tests  
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  # ---- Security Scan ----
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit
        run: bandit -r backend/app/ -ll

      - name: Check for known vulnerabilities
        run: |
          cd backend
          pip install -r requirements.txt
          safety check --json || true

  # ---- Docker Build Check ----
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        run: docker build -t phishguard-backend:test backend/ --target production

      - name: Build frontend image
        run: docker build -t phishguard-frontend:test frontend/ --target production
