version: '3.9'

# ============================================================
# PhishGuard AI — Docker Compose
# ============================================================
# Usage:
#   cp .env.example .env   # and fill in your values
#   docker-compose up --build
# ============================================================

networks:
  phishguard-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  upload_temp:

services:
  # ---- PostgreSQL ----------------------------------------
  db:
    image: postgres:16-alpine
    container_name: phishguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phishguard}
      POSTGRES_USER: ${POSTGRES_USER:-phishguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - phishguard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishguard} -d ${POSTGRES_DB:-phishguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ---------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: phishguard-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - phishguard-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend (FastAPI) ---------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: phishguard-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - upload_temp:/tmp/phishguard_uploads
    networks:
      - phishguard-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "

  # ---- Celery Worker -------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: phishguard-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - upload_temp:/tmp/phishguard_uploads
    networks:
      - phishguard-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=analysis,intelligence,reports
      --max-tasks-per-child=50

  # ---- Celery Beat (Scheduler) ---------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: phishguard-beat
    restart: unless-stopped
    env_file: .env
    networks:
      - phishguard-net
    depends_on:
      - worker
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler

  # ---- Frontend (Next.js) --------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: phishguard-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file: .env
    networks:
      - phishguard-net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Nginx Reverse Proxy --------------------------------
  nginx:
    image: nginx:alpine
    container_name: phishguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - phishguard-net
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
